name: Generate ER Diagrams

on:
  push:
    paths:
      - 'backend/src/Models/schema_full.sql'
      - 'docs/er/*.mmd'
      - '.github/workflows/generate-er-diagrams.yml'
  pull_request:
    paths:
      - 'backend/src/Models/schema_full.sql'
      - 'docs/er/*.mmd'

permissions:
  contents: write

jobs:
  er-diagrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (root)
        run: |
          if [ -f package.json ]; then npm ci; else echo 'No root package.json'; fi

      - name: Install mermaid-cli if not present
        run: |
          if ! npx --yes @mermaid-js/mermaid-cli -V > /dev/null 2>&1; then \
            npm install --no-save @mermaid-js/mermaid-cli; \
          fi

      - name: Generate ER diagrams
        run: |
          pwsh -File ./docs/er/export-er-diagrams.ps1 -OutDir ./docs/er/rendered

      - name: Commit updated diagrams (if changed)
        run: |
          if [ -n "$(git status --porcelain docs/er/rendered)" ]; then \
            git config user.name 'github-actions[bot]' ; \
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com' ; \
            git add docs/er/rendered ; \
            git commit -m 'ci: update ER diagrams [skip ci]' ; \
            git push ; \
          else \
            echo 'No diagram changes'; \
          fi

      - name: Upload rendered diagrams as artifact
        uses: actions/upload-artifact@v4
        with:
          name: er-diagrams
          path: docs/er/rendered
          if-no-files-found: warn
